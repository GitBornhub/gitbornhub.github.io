<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的个人博客</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 40px; line-height: 1.6; }
        .post-card { border-bottom: 1px solid #eee; padding: 20px 0; }
        .post-card a { text-decoration: none; color: #333; font-size: 1.2em; font-weight: bold; }
        .post-card a:hover { color: #007bff; }
        .meta { color: #888; font-size: 0.9em; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>最新文章</h1>
    <div id="blog-list">加载中...</div>

    <script>
        fetch('posts.json')
            .then(res => res.json())
            .then(data => {
                // 按日期排序（最新在前）
                data.sort((a, b) => new Date(b.date) - new Date(a.date));

                const container = document.getElementById('blog-list');
                container.innerHTML = ''; // 清空加载提示

                data.forEach(post => {
                    const html = `
                        <div class="post-card">
                            <a href="${post.url}">${post.title}</a>
                            <div class="meta">发布于：${post.date}</div>
                            <p>${post.summary}</p>
                        </div>
                    `;
                    container.innerHTML += html;
                });
            });
    </script>
</body>
</html>

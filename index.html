<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noah's Ark</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Nothing to say.<br>Just share life.</h1>
        </header>
         
        <main id="post-list">
            </main>
        <!-- 建议把 footer 放在 .container 内部的最下方 -->
        <footer>
            <p>© 2026 Noah's Ark · Powered by GitHub Pages</p>
        </footer>
    </div>

    <script>
        fetch('posts.json')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('post-list');
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'post-item';
                    div.innerHTML = `
                        <span>${item.date}</span>
                        <a href="posts/post.html?file=${item.file}">${item.title}</a>
                    `;
                    list.appendChild(div);
                });
            });
    </script>
    
</body>

</html>

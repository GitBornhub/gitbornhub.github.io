<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的 JSON 动态博客</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 600px; margin: 0 auto; padding: 20px; }
        header { border-bottom: 2px solid #333; margin-bottom: 20px; }
        .post-item { border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 5px; cursor: pointer; }
        .post-item:hover { background: #f9f9f9; }
        .hidden { display: none; }
        #back-btn { margin-top: 20px; color: blue; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>我的个人博客</h1>
    </header>

    <div id="home-page">
        <h2>最新文章</h2>
        <div id="post-list">加载中...</div> </div>

    <div id="post-page" class="hidden">
        <h2 id="post-title"></h2>
        <p id="post-content"></p>
        <div id="back-btn" onclick="showHome()">← 返回主页</div>
    </div>

    <script>
        let allPosts = []; // 用来存放从 JSON 读取到的所有数据

        // 1. 核心步骤：从 JSON 文件获取数据
        fetch('posts.json')
            .then(response => response.json()) // 把读取到的数据转成 JSON 格式
            .then(data => {
                allPosts = data; 
                renderList(data); // 拿到数据后，去画出列表
            });

        // 2. 将数据“画”在主页上
        function renderList(posts) {
            const listContainer = document.getElementById('post-list');
            listContainer.innerHTML = ''; // 清空“加载中”

            posts.forEach(post => {
                const item = document.createElement('div');
                item.className = 'post-item';
                // 给每个文章块绑定点击事件，传入它的 ID
                item.onclick = () => showPost(post.id);
                item.innerHTML = `<strong>${post.title}</strong> <small>${post.date}</small><br>${post.summary}`;
                listContainer.appendChild(item);
            });
        }

        // 3. 根据 ID 显示全文
        function showPost(id) {
            const post = allPosts.find(p => p.id === id); // 在数据里找对应的文章
            if (post) {
                document.getElementById('home-page').classList.add('hidden');
                document.getElementById('post-page').classList.remove('hidden');
                document.getElementById('post-title').innerText = post.title;
                document.getElementById('post-content').innerText = post.content;
            }
        }

        function showHome() {
            document.getElementById('home-page').classList.remove('hidden');
            document.getElementById('post-page').classList.add('hidden');
        }
    </script>
</body>
</html>

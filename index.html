<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #fafaf9;
            --bg-secondary: #ffffff;
            --text-primary: #292524;
            --text-secondary: #57534e;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --border: #e7e5e4;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-primary: #1c1917;
            --bg-secondary: #292524;
            --text-primary: #fafaf9;
            --text-secondary: #d6d3d1;
            --accent: #fbbf24;
            --accent-hover: #f59e0b;
            --border: #44403c;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
            line-height: 1.6;
        }

        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px var(--shadow);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--accent);
            background: var(--bg-primary);
        }

        .theme-toggle {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background: var(--accent);
            color: white;
            transform: scale(1.05);
        }

        .hero {
            text-align: center;
            padding: 4rem 2rem;
            max-width: 800px;
            margin: 0 auto;
            min-height: 50vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
            font-weight: 800;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .post-card {
            background: var(--bg-secondary);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 4px 12px var(--shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .post-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 24px var(--shadow);
        }

        .post-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--accent), #fb923c);
        }

        .post-content {
            padding: 1.5rem;
        }

        .post-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .post-excerpt {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .post-meta {
            color: var(--accent);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .about-page {
            display: none;
            max-width: 800px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .about-page.active {
            display: block;
        }

        .about-page h2 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: var(--accent);
        }

        .about-page p {
            font-size: 1.125rem;
            line-height: 1.8;
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
        }

        .home-page.active {
            display: block;
        }

        .home-page {
            display: none;
        }

        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .posts-grid {
                grid-template-columns: 1fr;
            }

            nav {
                justify-content: center;
            }

            .nav-links {
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">我的个人博客</div>
            <div class="nav-links">
                <a href="#" class="nav-link active" data-page="home">首页</a>
                <a href="#" class="nav-link" data-page="about">关于</a>
                <button class="theme-toggle" id="themeToggle">🌙</button>
            </div>
        </nav>
    </header>

    <div class="home-page active">
        <div class="hero">
            <h1>我的个人博客</h1>
            <p>欢迎来到我的个人博客！这里记录着我的想法、学习和生活。</p>
        </div>

        <div class="content">
            <div class="posts-grid" id="postsGrid"></div>
        </div>
    </div>

    <div class="about-page">
        <h2>关于我</h2>
        <p>你好！我是一名热爱技术和生活的开发者，这个博客是我记录学习历程和生活感悟的小天地。</p>
        <p>在这里，你可以看到我对编程技术的探索、对生活的思考，以及一些学习心得。我相信持续学习和分享是成长的最好方式。</p>
        <p>我喜欢尝试新技术，享受解决问题带来的成就感。除了编程，我也热爱阅读、旅行和摄影，这些爱好让我的生活更加丰富多彩。</p>
        <p>如果你对我的文章有任何想法或建议，欢迎与我交流！</p>
    </div>

    <script>
        const posts = [
            {
                title: "JavaScript 异步编程实践",
                excerpt: "深入探讨 Promise、async/await 的使用技巧，以及如何优雅地处理异步操作中的错误。通过实际案例，让你真正理解异步编程的精髓。",
                date: "2024-01-15",
                gradient: "linear-gradient(135deg, #f59e0b, #fb923c)"
            },
            {
                title: "我的 2024 年度总结",
                excerpt: "回顾这一年的成长与收获，分享工作、学习和生活中的点点滴滴。有挑战也有惊喜，每一步都是成长的印记。",
                date: "2024-01-10",
                gradient: "linear-gradient(135deg, #fbbf24, #fcd34d)"
            },
            {
                title: "高效学习方法论",
                excerpt: "探索如何在信息爆炸的时代保持高效学习，分享我的学习工具和方法。建立知识体系，让学习变得更有条理和乐趣。",
                date: "2024-01-05",
                gradient: "linear-gradient(135deg, #fb923c, #fdba74)"
            },
            {
                title: "CSS Grid 布局完全指南",
                excerpt: "从基础到进阶，全面讲解 CSS Grid 布局系统。通过丰富的示例代码，帮助你快速掌握现代网页布局技术。",
                date: "2023-12-28",
                gradient: "linear-gradient(135deg, #f59e0b, #fbbf24)"
            },
            {
                title: "咖啡与代码的美好时光",
                excerpt: "分享我的工作日常和喜欢的咖啡店。一杯好咖啡配上几行优雅的代码，这就是程序员的小确幸。",
                date: "2023-12-20",
                gradient: "linear-gradient(135deg, #fbbf24, #f59e0b)"
            },
            {
                title: "React Hooks 最佳实践",
                excerpt: "总结 React Hooks 使用中的常见陷阱和最佳实践，包括性能优化技巧和自定义 Hook 的设计思路。",
                date: "2023-12-15",
                gradient: "linear-gradient(135deg, #fb923c, #f59e0b)"
            }
        ];

        const postsGrid = document.getElementById('postsGrid');
        
        posts.forEach(post => {
            const card = document.createElement('div');
            card.className = 'post-card';
            card.innerHTML = `
                <div class="post-image" style="background: ${post.gradient}"></div>
                <div class="post-content">
                    <h3 class="post-title">${post.title}</h3>
                    <p class="post-excerpt">${post.excerpt}</p>
                    <div class="post-meta">${post.date}</div>
                </div>
            `;
            postsGrid.appendChild(card);
        });

        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        
        let isDark = false;
        
        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            html.setAttribute('data-theme', isDark ? 'dark' : 'light');
            themeToggle.textContent = isDark ? '☀️' : '🌙';
        });

        const navLinks = document.querySelectorAll('.nav-link');
        const homePage = document.querySelector('.home-page');
        const aboutPage = document.querySelector('.about-page');

        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const page = link.getAttribute('data-page');
                
                navLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');
                
                if (page === 'home') {
                    homePage.classList.add('active');
                    aboutPage.classList.remove('active');
                } else if (page === 'about') {
                    homePage.classList.remove('active');
                    aboutPage.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>

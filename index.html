<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>我的博客</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <h1>文章列表</h1>
    <div id="list">加载中...</div>

    <script>
        fetch('posts.json')
            .then(res => res.json())
            .then(data => {
                let html = '';
                data.forEach(item => {
                    // 核心：跳转到 posts 目录下的 post.html，并带上文件名参数
                    html += `<div style="margin-bottom:10px;">
                        <span>${item.date}</span> - 
                        <a href="posts/post.html?file=${item.file}">${item.title}</a>
                    </div>`;
                });
                document.getElementById('list').innerHTML = html;
            })
            .catch(e => document.getElementById('list').innerHTML = "列表加载失败，请检查 posts.json");
    </script>
</body>
</html>

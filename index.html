<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>我的个人博客</title>
    <style>
        /* CSS：负责装修 */
        body { font-family: sans-serif; line-height: 1.6; max-width: 600px; margin: 0 auto; padding: 20px; }
        header { border-bottom: 2px solid #333; margin-bottom: 20px; }
        .post-item { cursor: pointer; color: blue; text-decoration: underline; margin-bottom: 10px; }
        .hidden { display: none; } /* 隐藏不显示的元素 */
        #back-btn { margin-top: 20px; display: inline-block; cursor: pointer; color: green; }
    </style>
</head>
<body>

    <header>
        <h1>我的个人博客</h1>
    </header>

    <div id="home-page">
        <h2>最新文章</h2>
        <div class="post-item" onclick="showPost('第一篇汇总', '这是第一篇文章的全内容。HTML其实很简单！')">2026-02-12 - 学习HTML心得</div>
        <div class="post-item" onclick="showPost('我的生活', '今天天气不错，我打算开始写博客了。')">2026-02-11 - 日常随笔</div>
        <div class="post-item" onclick="showPost('第N次尝试写博客', '之前用Halo和WordPress试着建过博客网站，但是VPS商家出了问题，所有的数据全部丢失，只好转向更可靠的Github　Pages来记录我的日常。')">2026-02-13 - 自己试着用HTML写博客</div>
    </div>

    <div id="post-page" class="hidden">
        <h2 id="post-title"></h2>
        <p id="post-content"></p>
        <div id="back-btn" onclick="showHome()">← 返回主页</div>
    </div>

    <script>
        // JS：负责交互逻辑
        function showPost(title, content) {
            // 1. 隐藏列表页，显示详情页
            document.getElementById('home-page').classList.add('hidden');
            document.getElementById('post-page').classList.remove('hidden');
            // 2. 把内容填进去
            document.getElementById('post-title').innerText = title;
            document.getElementById('post-content').innerText = content;
        }

        function showHome() {
            // 切换回来
            document.getElementById('home-page').classList.remove('hidden');
            document.getElementById('post-page').classList.add('hidden');
        }
    </script>
</body>
</html>

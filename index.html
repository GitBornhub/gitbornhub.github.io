<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promise's Blog</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Welcome to Promise's Blog</h1>
            <p>There is my story.</p>
        </header>
        
        <main id="post-list">
            </main>
    </div>

    <script>
        fetch('posts.json')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('post-list');
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'post-item';
                    div.innerHTML = `
                        <span>${item.date}</span>
                        <a href="posts/post.html?file=${item.file}">${item.title}</a>
                    `;
                    list.appendChild(div);
                });
            });
    </script>
</body>
</html>

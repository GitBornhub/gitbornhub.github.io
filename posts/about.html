    <p>我是一个非常i的i人，不仅生活中不喜欢说话，在网上也很少发言，朋友圈知乎小红书都只有几个动态。平时就像是透明人一样的我为什么突然想要建立一个自己的博客呢？</p>
    <p>不说话不代表我没有思考。我原本是一个很敏感的人，后来在一次次失望落寞中学会了不放在心上。也就是说我对事情是有很多想法的，但是为了心理健康我通通都忽略了。平时脑袋空空，就显得一瞬间的想法非常宝贵，这些想法并不适合也不值得发表在社交媒体上，于是我就建一个博客当作日记记录自己的碎碎念。</p>

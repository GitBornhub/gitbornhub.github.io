<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在加载...</title>
    <link rel="stylesheet" href="../style.css"> <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <nav><a href="../index.html">← 返回首页</a></nav>
        <article id="content">
            </article>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const file = params.get('file');

        if (file) {
            fetch(file)
                .then(res => res.text())
                .then(md => {
                    document.getElementById('content').innerHTML = marked.parse(md);
                    document.title = file.replace('.md', '');
                })
                .catch(() => {
                    document.getElementById('content').innerHTML = "文章加载失败。";
                });
        }
    </script>
</body>
</html>

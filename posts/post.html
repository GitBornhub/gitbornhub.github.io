<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>阅读文章</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <nav><a href="../index.html">← 返回首页</a></nav>
    <div id="content">正在加载文章内容...</div>

    <script>
        // 1. 获取网址里的文件名 (例如 ?file=hello-world.md)
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file');

        if (fileName) {
            // 2. 因为 post.html 和 .md 都在 posts 文件夹，直接 fetch 即可
            fetch(fileName)
                .then(res => {
                    if(!res.ok) throw new Error("找不到该文件");
                    return res.text();
                })
                .then(mdText => {
                    // 3. 将 Markdown 转为 HTML 并显示
                    document.getElementById('content').innerHTML = marked.parse(mdText);
                })
                .catch(err => {
                    document.getElementById('content').innerHTML = "错误：" + err.message;
                });
        }
    </script>
</body>
</html>
